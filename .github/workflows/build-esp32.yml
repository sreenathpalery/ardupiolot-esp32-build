name: Build ArduPilot ESP32 Firmware

on:
  workflow_dispatch: # Allows manual trigger with a button in GitHub

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git wget flex bison gperf cmake ninja-build ccache libffi-dev libssl-dev dfu-util python3 python3-pip python3-setuptools
          pip3 install --user future pymavlink "empy==3.3.4" pexpect

      - name: Clone ArduPilot
        run: |
          git clone --depth 1 https://github.com/ArduPilot/ardupilot.git
          cd ardupilot
          git submodule update --init --depth 1 modules/mavlink
          git submodule update --init --depth 1 modules/waf

      - name: Setup ESP-IDF
        run: |
          cd ardupilot
          ./Tools/scripts/esp32_get_idf.sh
          cd modules/esp_idf
          ./install.sh
          . ./export.sh

      - name: Configure and Build ArduCopter
        run: |
          cd ardupilot
          . modules/esp_idf/export.sh
          ./waf configure
          ./waf configure --board=esp32buzz
          ./waf copter

      - name: Upload Binaries
        uses: actions/upload-artifact@v4
        with:
          name: ardupilot-esp32-binaries
          path: |
            ardupilot/build/esp32buzz/esp-idf_build/bootloader/bootloader.bin
            ardupilot/build/esp32buzz/esp-idf_build/partition_table/partition-table.bin
            ardupilot/build/esp32buzz/esp-idf_build/ardupilot.bin
            ardupilot/build/esp32buzz/esp-idf_build/ota_data_initial.bin
